<head>

<style>

  .mk{position:absolute;left:84px;bottom:96px;font:300 italic 34px/1 Cormorant,serif;color:#8C8A85}

</style>
</head>

  <svg class="lock" data-l="wc" role="img" aria-label="Јаснота"></svg>
